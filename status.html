<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Status SDTV</title>
<style>body{font-family:system-ui,sans-serif;background:#000;color:#fff;display:flex;min-height:100vh;align-items:center;justify-content:center;margin:0}.b{max-width:420px;padding:24px;text-align:center}.d{font-size:22px;margin:12px 0}.s{color:#aaa;font-size:14px}</style></head>
<body><div class="b"><h1>SDTV — Status</h1><div class="d" id="tv">Verificando…</div><div class="d" id="pn"></div><p class="s" id="at"></p><p class="s">Se estiver instável, não precisa reinstalar nada: volta sozinho quando normalizar.</p></div>
<script>
async function go(){try{const r=await (await fetch('https://whywhebigdgzbcbbfdch.supabase.co/functions/v1/app?a=status',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'})).json();
document.getElementById('tv').textContent=(r.tv?'🟢':'🔴')+' Canais e filmes '+(r.tv?'funcionando':'com instabilidade');
document.getElementById('pn').textContent=(r.painel?'🟢':'🔴')+' Ativação e renovação '+(r.painel?'funcionando':'com instabilidade');
document.getElementById('at').textContent='Atualizado: '+new Date(r.at).toLocaleString('pt-BR');}catch(e){document.getElementById('tv').textContent='Não consegui verificar agora.'}}
go();setInterval(go,60000);
</script></body></html>
